name: Release

# Build and publish to PyPI on a version tag (e.g. v0.0.1).
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token is stored in
# this repo. Configure the trusted publisher once on pypi.org first; see
# docs/releasing.md.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7   # v7 is the latest *moving* major (Node 24); setup-uv has no `v8` tag, only v8.x
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/mcp-app/package-lock.json
      - name: Build MCP review UI
        run: |
          npm --prefix integrations/mcp-app ci
          npm --prefix integrations/mcp-app run build
      - name: Build distributions
        run: uv build
      - name: Verify and package shared agent plugin
        run: |
          uv run --no-project python scripts/build_agent_plugin.py --check
          uv run --no-project python scripts/build_agent_plugin.py --output build/plugin --archive build/vectoreyes-plugin.zip
      - name: Verify installed wheel widget
        run: |
          uv venv /tmp/vectoreyes-wheel-check --python 3.13
          for wheel in dist/*.whl; do
            uv pip install --python /tmp/vectoreyes-wheel-check/bin/python "${wheel}[server,scoring]" pytest
          done
          expected=$(sha256sum integrations/mcp-app/dist/mcp-app.html | cut -d ' ' -f 1)
          cd /tmp
          /tmp/vectoreyes-wheel-check/bin/python - "$expected" <<'PY'
          import hashlib
          import importlib.machinery
          import sys
          import vectoreyes.fit
          from vectoreyes.mcp_server import logo_widget
          assert any(vectoreyes.fit.__file__.endswith(suffix)
                     for suffix in importlib.machinery.EXTENSION_SUFFIXES)
          assert hashlib.sha256(logo_widget().encode("utf-8")).hexdigest() == sys.argv[1]
          PY
      - name: Test installed compiled engine
        run: /tmp/vectoreyes-wheel-check/bin/python -m pytest tests --import-mode=importlib -q
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: vectoreyes-plugin
          path: build/vectoreyes-plugin.zip

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Bind to a GitHub Environment so the trusted publisher can be scoped to it
    # on PyPI. Create an environment named "pypi" in repo settings.
    environment:
      name: pypi
      url: https://pypi.org/project/vectoreyes/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
