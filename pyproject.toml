[project]
name = "vectoreyes"
version = "0.2.1"
description = "Deterministic logo idealizer — rendered logo raster to clean, editable, symmetric SVG."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["svg", "vectorization", "logo", "raster-to-vector", "image-tracing", "idealize"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # skimage 0.26 EllipseModel cannot handle NumPy 2.5's always-complex eig.
    "numpy>=2.0,<2.5",
    "scipy>=1.13",
    "scikit-image>=0.26,<0.27",
    "skia-python>=87.4",
    "pillow>=10.0",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/pradeepmouli/vectoreyes"
Repository = "https://github.com/pradeepmouli/vectoreyes"
Issues = "https://github.com/pradeepmouli/vectoreyes/issues"

[project.optional-dependencies]
# render-ΔE scored candidate selection (without it, selection falls back to the
# cascade-priority pick and warns once — see vectoreyes.score).
scoring = ["resvg-py>=0.1.7"]
# the MCP server (`vectoreyes-mcp`); only needed to expose vectoreyes over MCP.
server = ["fastmcp>=4.1,<5", "mcp>=2.2,<3", "httpx>=0.28.1,<1"]
# skia-python is now a required dependency (promoted from optional).
# This empty extra is kept for backwards compatibility with any installs that
# reference `vectoreyes[skia]`.
skia = []
dev = [
    "pytest>=8.0",
    "vectoreyes[scoring,server]",
]

[project.scripts]
vectoreyes = "vectoreyes.cli:main"
vectoreyes-mcp = "vectoreyes.mcp_server:main"

[build-system]
requires = ["hatchling", "Cython>=3.2,<4", "setuptools>=80"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectoreyes"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"integrations/mcp-app/dist/mcp-app.html" = "vectoreyes/assets/mcp-app.html"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/vectoreyes",
    "tests",
    "docs",
    "scripts",
    "integrations/mcp-app/src",
    "integrations/mcp-app/package.json",
    "integrations/mcp-app/package-lock.json",
    "integrations/mcp-app/mcp-app.html",
    "integrations/mcp-app/tsconfig.json",
    "integrations/mcp-app/vite.config.ts",
    "integrations/plugin.json",
    "integrations/plugin",
    ".agents/plugins/marketplace.json",
    ".claude-plugin/marketplace.json",
    "pyproject.toml",
    "hatch_build.py",
    "uv.lock",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"integrations/mcp-app/dist/mcp-app.html" = "integrations/mcp-app/dist/mcp-app.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
